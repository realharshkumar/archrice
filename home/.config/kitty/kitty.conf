include theme.conf

# Font

# Scollback and mouse
copy_on_select	 clipboard
url_style	 curly
detect_url	 yes

# startup window
initial_window_width    65c
initial_window_height   17c
remember_window_size    no
hide_window_decorations yes
wayland_titlebar_color  background

#tab bar
tab_bar_edge             top
tab_bar_style            powerline
tab_powerline_style      angled
tab_bar_min_tabs         2
tab_title_template       "{index}: {title}"

active_tab_foreground    #1e1e2e
active_tab_background    #89b4fa
active_tab_font_style    bold
inactive_tab_foreground  #cdd6f4
inactive_tab_background  #313244
tab_bar_background       #181825

bold_font		 auto
italic_font		 auto
bold_italic_font   	 auto
disable_ligatures  	 never

# Look
background_opacity   0.9
window_padding_width 8

# Window settings
window_padding_width        5
single_window_padding_width 5
window_border_width         1pt
active_border_color         #e0212f
inactive_border_color       #45475a

# Shape: block, beam, or underline
cursor_shape             beam
cursor_beam_thickness    1.5
cursor_underline_thickness 2.0

# Blinking (0 = no blink)
cursor_blink_interval    0.5
cursor_stop_blinking_after 15.0

# Color (you already have these)
cursor                   #e0212f

# Animated trail (kitty 0.37+, optional)
cursor_trail             3
cursor_trail_decay       0.1 0.4

color0  #45475a
color8  #585b70
color1  #f38ba8
color9  #f38ba8
color2  #a6e3a1
color10 #a6e3a1
color3  #f9e2af
color11 #f9e2af
color4  #89b4fa
color12 #89b4fa
color5  #f5c2e7
color13 #f5c2e7
color6  #94e2d5
color14 #94e2d5
color7  #bac2de
color15 #a6adc8

# Behavior
enable_audio_bell       no
confirm_os_window_close 0
